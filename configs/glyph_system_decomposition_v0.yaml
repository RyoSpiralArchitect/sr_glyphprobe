  expected_acquired_items: 843
  expected_prior_exposed_atomic_anchors: 64
  expected_new_discovery_items: 779
  expected_reserve_items: 268
  acquisition_order: ascending_unicode_source_index
  reserve_model_forward_calls_in_t11: 0
  reserve_tokenizer_inspection_allowed: true
  replacement_or_exclusion_after_freeze: forbidden
  atomic_anchor_provenance: all_single_codepoint_items_were_forwarded_in_t8_or_t9
  unusual_sequence_provenance: absent_from_t8_t9_t10_item_populations

views:
  order: [glyph, unicode_name, component_name, codepoint_literal, decomposed_form]
  atomic_anchor_available: [glyph, unicode_name, codepoint_literal]
  unusual_system_available: [glyph, unicode_name, component_name, codepoint_literal, decomposed_form]
  glyph: exact_fully_qualified_unicode_sequence
  unicode_name: exact_name_from_pinned_unicode_emoji_test
  component_name: >-
    Deterministic label derived from pinned emoji-test component names and,
    only when no emoji-test component label exists, lowercase Unicode scalar
    names. It is not a standardized alias or semantic ground truth.
  codepoint_literal: uppercase_U_plus_sequence_joined_by_spaces
  decomposed_form:
    presentation: remove_FE0E_or_FE0F
    modifier: insert_ASCII_space_between_base_and_modifier_components
    zwj: replace_each_ZWJ_with_ASCII_space_and_retain_other_scalars
    regional_flag: map_regional_indicators_to_two_ASCII_letters
    keycap: retain_the_base_number_sign_asterisk_or_digit_only
    tag_flag: map_tag_letters_to_lowercase_ASCII_and_remove_cancel_tag
  uniqueness_requirement: every_available_view_unique_within_each_analysis_system

input:
  carrier_order: [article_a, pipe]
  carriers:
    article_a: {unit: " a", repeats: 8}
    pipe: {unit: " |", repeats: 8}
  distance_order: [1, 2, 4, 8]
  add_special_tokens: false
  position_rule: raw_view_token_count_plus_distance_minus_one
  fused_distance_readout: true
  exact_boundary_rule: raw_view_token_ids_plus_eight_identical_single_carrier_tokens
  batch_size_unique_sequences: 1

endpoints:
  broad_order: [raw_last_decoder_block_output, returned_final_hidden_state]
  broad:
    raw_last_decoder_block_output:
      api_contract: forward_hook_on_last_decoder_block_output_before_model_final_norm
      interpretation: architecture_exposed_raw_last_block_output
    returned_final_hidden_state:
      api_contract: output.hidden_states[-1]
      interpretation: model_API_returned_final_hidden_state_after_final_norm_when_implemented
  depth_order:
    - embedding_output
    - interblock_depth_0p25
    - interblock_depth_0p50
    - interblock_depth_0p75
    - raw_last_decoder_block_output
    - returned_final_hidden_state
  depth_fractions: [0.25, 0.50, 0.75]
  intermediate_resolution: output.hidden_states[floor(fraction_times_num_hidden_layers)]
  cross_architecture_caveat: API_interblock_states_are_not_claimed_to_be_mechanistically_identical_sites
  final_norm_is_explicit_analysis_axis: true

depth_subset:
  atomic_anchor_per_group: 3
  quotas:
    atomic_anchor: 24
    presentation: 24
    modifier: 40
    zwj: 56
    regional_flag: 40
    keycap: 8
    tag_flag: 0
  expected_items: 192
  expected_present_item_views: 912
  selection_rule: >-
    Lowest SHA256 within each acquired system under the depth namespace;
    atomic anchors use three items from each of the eight frozen Unicode groups.
  fixed_before_any_t11_model_forward: true

tokenization_controls:
  matched_incorrect_label_targets: [unicode_name, component_name]
  required_match_key: [glyph_system, target_token_count]
  sensitivity_match_key: [glyph_system, target_token_count, first_target_token_id]
  mapping_rule: deterministic_one_step_cycle_after_control_hash_sort_within_each_non_singleton_stratum
  depth_subset_uses_independently_constructed_mapping_with_the_same_rule: true
  self_match_forbidden: true
  candidate_and_query_universe: same_glyph_system_and_same_view_availability
  required_minimum_coverage:
    atomic_anchor: 0.75
    presentation: 0.75
    modifier: 0.75
    zwj: 0.75
    regional_flag: 0.75
    keycap: 0.75
  tag_flag_role: bounded_three_item_microcase_no_distributional_or_matched_control_claim
  strict_prefix_sensitivity_has_no_minimum_coverage_gate: true
  no_outcome_dependent_control_repair: true
  codepoint_literal_is_not_the_sole_negative_control: true

