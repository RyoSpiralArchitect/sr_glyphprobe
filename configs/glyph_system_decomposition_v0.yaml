    - presentation
    - modifier
    - zwj
    - regional_flag
    - keycap
    - tag_flag
  role_order: [calibration_prior_exposed, discovery_unseen, reserve_unrun]
  atomic_anchor_groups:
    - Smileys & Emotion
    - People & Body
    - Animals & Nature
    - Food & Drink
    - Travel & Places
    - Activities
    - Objects
    - Symbols
  quotas:
    atomic_anchor: {calibration_prior_exposed: 64, discovery_unseen: 0, reserve_unrun: 0}
    presentation: {calibration_prior_exposed: 0, discovery_unseen: 160, reserve_unrun: 40}
    modifier: {calibration_prior_exposed: 0, discovery_unseen: 192, reserve_unrun: 64}
    zwj: {calibration_prior_exposed: 0, discovery_unseen: 256, reserve_unrun: 96}
    regional_flag: {calibration_prior_exposed: 0, discovery_unseen: 160, reserve_unrun: 64}
    keycap: {calibration_prior_exposed: 0, discovery_unseen: 8, reserve_unrun: 4}
    tag_flag: {calibration_prior_exposed: 0, discovery_unseen: 3, reserve_unrun: 0}
