  item_shard_size: 16
  expected_shards_per_model: 53
  expected_total_shards: 477
  expected_present_item_views: 4087
  expected_model_forward_calls_per_model: 8174
  expected_total_model_forward_calls: 73566
  expected_broad_readout_vectors_per_model: 65392
  expected_depth_readout_vectors_per_model: 43776
  expected_total_stored_readout_vectors_per_model: 109168
  expected_total_stored_readout_vectors: 982512
  activation_dtype: float32
  broad_axis_order: [item, view, carrier, distance, broad_endpoint, width]
  depth_axis_order: [depth_item, view, carrier, distance, depth_endpoint, width]
  absent_view_storage: NaN_with_explicit_boolean_view_mask
  completed_shards_are_never_reacquired: true
  incomplete_stage_policy: fail_closed_manual_adjudication_before_any_retry
  raw_activations_committed_to_git: false
  raw_activations_put_on_spiralshare: false

analysis:
  role: exploratory_discovery_only_no_t11_primary_hypothesis_test
  analysis_systems: [atomic_anchor, presentation, modifier, zwj, regional_flag, keycap]
  microcase_systems: [tag_flag]
  broad_cell_grid: complete_two_carrier_by_four_distance_grid
  per_system_metrics:
    - matched_incorrect_label_paired_cosine_advantage
    - forward_and_reverse_top1
    - forward_and_reverse_mean_reciprocal_rank
    - paired_minus_off_diagonal_margin
    - retrieval_breadth_and_top_decile_concentration
    - centered_linear_cka
  decomposition_contrasts:
    lexicalization: >-
      matched-control-adjusted glyph-to-unicode-name advantage minus
      matched-control-adjusted glyph-to-component-name advantage
    presentation_or_fusion: >-
      matched-control-adjusted glyph-to-unicode-name advantage minus
      matched-control-adjusted decomposed-form-to-unicode-name advantage
    component_tracking: >-
      matched-control-adjusted decomposed-form-to-component-name advantage
      minus matched-control-adjusted glyph-to-component-name advantage
  aggregation:
    primary_descriptive_location: median_item_margin
    uncertainty: percentile_item_bootstrap_95_percent_interval_descriptive_only
    bootstrap_draws: 2000
    bootstrap_seed: 2026082901
    context_stability: sign_fraction_range_and_median_absolute_deviation_over_eight_cells
    minimum_top1_role: secondary_T10_comparability_only
  cross_model:
    - per_view_item_geometry_linear_CKA
    - full_cross_view_cosine_map_Spearman
    - paired_item_margin_Spearman
    - model_by_system_by_context_variance_decomposition
  depth:
    - fixed_subset_margin_trajectory
    - first_depth_at_which_bootstrap_interval_excludes_zero_descriptive_only
    - raw_last_block_to_returned_final_state_delta
  reserve_policy: >-
    T11 may bind public reserve identities and tokenizer-only covariates, but
    must not forward reserve items or read reserve model outcomes.

