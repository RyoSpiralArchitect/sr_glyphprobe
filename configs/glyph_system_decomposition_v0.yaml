landing_patterns:
  compositional_candidate: >-
    Decomposed forms and component labels retain matched-control advantages
    across multiple systems and model cells. Freeze a narrow T12 reserve test
    before opening reserve outcomes.
  lexicalization_candidate: >-
    Whole official names dominate component labels after their separate
    matched controls. Frame the next test around lexicalized sequence identity,
    not generic compositional semantics.
  presentation_or_final_norm_candidate: >-
    Effects change with VS16/fusion or between raw last-block and returned final
    state. Localize the next experiment to that boundary without calling it a
    mechanism.
  model_conditioned_regimes: >-
    Direction or context stability differs materially by frozen model cell.
    Retain an architecture-conditioned atlas and do not pool a model-general
    effect.
  tokenizer_structural_account: >-
    Required token-length-matched incorrect-label controls erase the apparent
    advantage. Preserve the bounded negative and do not widen the panel.
  broad_bounded_null: >-
    Continuous matched margins and geometry show no coherent system-level
    pattern. Treat T8-T10 as a narrower single-codepoint alignment boundary.

failure_policy:
  fail_closed_on_source_config_freeze_or_selection_hash_mismatch: true
  fail_closed_on_model_artifact_or_runtime_mismatch: true
  fail_closed_on_carrier_boundary_or_view_uniqueness_failure: true
  fail_closed_on_required_matched_control_coverage_failure_before_weight_load: true
  fail_closed_on_nonfinite_present_activation_or_non_NaN_absent_view: true
  fail_closed_on_reserve_forward_attempt: true
  fail_closed_on_foreign_GPU_compute_before_model_load_or_next_shard: true
  retain_failed_or_null_model_cells: true

