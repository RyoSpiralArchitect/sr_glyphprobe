protocol_id: glyphprobe-glyph-system-decomposition-v0
experiment_label: T11
experiment_role: prospective_exploratory_glyph_system_decomposition_atlas
status_before_execution: design_candidate_zero_t11_model_forwards
question: >-
  Does glyph-to-name correspondence track a glyph's compositional structure,
  presentation form, or whole-sequence lexicalization, and at which normalized
  depth or final-normalization boundary do frozen model/tokenizer cells diverge?
claim_boundary: >-
  T11 is a prospective-for-its-own-outcomes exploratory atlas. It compares
  standards-defined multi-codepoint glyph systems, deterministic component
  forms and labels, matched incorrect labels, contexts, inter-block depths, the
  raw last decoder-block output, and the API-returned final hidden state across
  the same nine model/tokenizer cells used by T10. It cannot rescue or alter
  T10; establish emoji meaning, understanding, causality, mechanism, behavior,
  tokenizer independence, a scale law, an instruction-tuning effect,
  architecture or model generality, or independent replication; or inspect
  T11 reserve model outcomes before a later T12 endpoint and multiplicity
  family are frozen.

