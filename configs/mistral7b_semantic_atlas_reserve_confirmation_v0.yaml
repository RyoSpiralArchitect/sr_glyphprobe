population:
  source_role: reserved_unrun
  order: ascending_source_index
  expected_items: 292
  prior_recorded_model_inputs_forwarded: 0
  replacement_or_exclusion_after_freeze: forbidden

input:
  view_order: [glyph, unicode_name, codepoint_literal]
  carrier_order: [article_a, pipe]
  carriers:
    article_a: {unit: " a", repeats: 8, expected_token_id: 1032}
    pipe: {unit: " |", repeats: 8, expected_token_id: 1110}
  distance_order: [1, 2, 4, 8]
  add_special_tokens: false
  site: resid_post
  position_rule: view_token_count_plus_distance_minus_one
  fused_distance_readout: true

acquisition:
  layers: [31]
  item_shard_size: 32
  expected_shards: 10
  batch_size_unique_sequences: 1
  expected_unique_input_sequences: 1752
  expected_model_forward_calls: 1752
  expected_readout_vectors: 7008
  activation_dtype: float32
  activation_axis_order: [item, view, carrier, distance, layer, width]
  raw_activations_committed_to_git: false
  completed_shards_are_never_reacquired: true
  partial_shard_means_protocol_invalid_without_manual_adjudication: true

primary_endpoint:
  population: all_292_reserved_items
  layer: 31
  query_view: glyph
  positive_target_view: unicode_name
  negative_control_view: codepoint_literal
  metric: forward_top1_item_retrieval_after_separate_view_centering_and_row_l2_normalization
  cells: complete_two_carrier_by_four_distance_grid
  cell_weighting: equal
  statistic: minimum_over_eight_cells_of_glyph_name_top1_minus_glyph_codepoint_top1
  practical_minimum: 0.02
  randomization_null: >-
    Apply one common random permutation of official-name item correspondence
    across all eight cells while retaining the observed codepoint control and
    all representation matrices. Recompute the minimum eight-cell contrast.
  randomization_seed: 20260828
  randomization_draws: 19999
  p_value: one_plus_exceedances_divided_by_20000
  alpha: 0.05
  multiplicity: none_single_global_minimum_statistic
  positive_rule: permutation_p_le_alpha_and_observed_minimum_ge_0.02
  negative_rule: every_other_complete_outcome

discovery_design_basis:
  population_items: 842
  observed_minimum_cell_contrast: 0.08076009538490325
  observed_equal_cell_mean_contrast: 0.13539192931784783
  smallest_cell: {carrier: pipe, distance: 2}
  practical_minimum_fraction_of_discovery_minimum: 0.24764705767966028
  endpoint_selected_after_discovery: true
  reserve_outcome_seen_when_selected: false

