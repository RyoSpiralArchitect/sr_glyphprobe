protocol_id: glyphprobe-mistral7b-semantic-atlas-reserve-confirmation-v0
experiment_role: prospective_single_use_reserve_confirmation_of_late_depth_glyph_name_alignment
claim_boundary: >-
  One fixed confirmatory test in the previously unforwarded 292-item reserve of
  the Mistral 7B v0.3 semantic atlas. A positive result may establish only that,
  in this model and frozen transport grid, layer-31 residual geometry retrieves
  the correct official Unicode name more strongly than the literal U+ codepoint
  control across every prespecified carrier-distance cell. It does not identify
  human meaning, tokenization causality, a mechanism, behavior, model
  generality, or a complete Phase I paper claim.

