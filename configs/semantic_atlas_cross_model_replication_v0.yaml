protocol_id: glyphprobe-semantic-atlas-cross-model-replication-v0
experiment_role: prospective_cross_model_tokenizer_cell_replication_of_t9_item_name_alignment
claim_boundary: >-
  A fixed nine-cell observational replication of the T9 glyph-to-official-name
  item-retrieval contrast on the same 292-item population, text views,
  carriers, distances, batch-one acquisition rule, and API-level final hidden
  state. The sole cross-cell primary can establish only that at least three of
  four frozen core model/tokenizer cells meet the registered statistical and
  practical rules. It cannot establish emoji meaning, semantic decomposition,
  tokenizer causality or independence, a mechanism, behavior, a base-versus-
  instruction effect, a scale law, architecture generality, or universal model
  generality. Shared items, training corpora, and tokenizer ancestry mean the
  cells are not described as independent replications.

source_bindings:
  population_manifest: data/manifests/mistral7b_semantic_atlas_selection_v0.json
  population_manifest_sha256: fe452c56cc96e079d832e2d1945b7d7bdd69fa0e44a3cbdd21fd05c9b6517532
  t9_freeze_manifest: data/manifests/mistral7b_semantic_atlas_reserve_confirmation_v0.json
  t9_freeze_manifest_sha256: a678213ad79f3fced9c6cffe502b38e16b49a517cdf9d18ba75ef855a8efcc58
  t9_run_receipt: artifacts/mistral7b_semantic_atlas_reserve_confirmation_v0/run/run_receipt.json
  t9_run_receipt_sha256: 736f575b69b3d23f49233aa2fe7af8afa3911f1699fc111fd8a17eb011d72a65
  t9_primary_result: artifacts/mistral7b_semantic_atlas_reserve_confirmation_v0/analysis/primary_result.json
  t9_primary_result_sha256: ea5824a0b6c6fdd966f7920958081b67b9ee06c855ad1b31646e0865a06cb5a9
  t9_analysis_receipt: artifacts/mistral7b_semantic_atlas_reserve_confirmation_v0/analysis/analysis_receipt.json
  t9_analysis_receipt_sha256: 19e7190effec8ac057ac24cf4c893185ed5f64e67a89cef417a5b9e1047d27c1
  t9_result_known_before_design: true
  t10_candidate_activation_outcomes_seen_at_freeze: false

population:
  source_role: reserved_unrun
  order: ascending_source_index
  expected_items: 292
  replacement_or_exclusion_after_freeze: forbidden
  relationship_to_t9: same_items_now_prior_exposed_by_t9
  inferential_role: fixed_transfer_population_not_a_new_item_holdout

input:
  view_order: [glyph, unicode_name, codepoint_literal]
  carrier_order: [article_a, pipe]
  carriers:
    article_a: {unit: " a", repeats: 8}
    pipe: {unit: " |", repeats: 8}
  distance_order: [1, 2, 4, 8]
  add_special_tokens: false
  position_rule: view_token_count_plus_distance_minus_one
  fused_distance_readout: true
  exact_boundary_rule: raw_view_token_ids_plus_eight_identical_single_carrier_tokens

endpoints:
  order: [returned_final_hidden_state, raw_last_decoder_block_output]
  primary:
    id: returned_final_hidden_state
    api_contract: output.hidden_states[-1]
    interpretation: final_normalized_hidden_state_returned_by_transformers_model_api
    relationship_to_t9: exact_api_level_match_to_t9_output_hidden_states_layer_plus_one_at_layer_31
    decision_authorized: true
  secondary:
    id: raw_last_decoder_block_output
    api_contract: forward_hook_on_last_decoder_block_output_before_model_final_norm
    interpretation: unnormalized_last_decoder_block_output_when_architecture_exposes_model_layers
    decision_authorized: false
    cannot_rescue_primary: true
  terminology_correction: >-
    T8/T9 called the layer-31 endpoint resid_post. A synthetic implementation
    audit showed that output.hidden_states[-1] equals the model-final normalized
    hidden state rather than the raw last decoder-block output. T10 preserves
    that returned state as primary and records the raw block output separately.

acquisition:
  item_shard_size: 8
  expected_shards_per_model: 37
  batch_size_unique_sequences: 1
  expected_unique_input_sequences_per_model: 1752
  expected_model_forward_calls_per_model: 1752
  expected_readout_vectors_per_model: 14016
  expected_model_cells: 9
  expected_total_model_forward_calls: 15768
  expected_total_readout_vectors: 126144
  activation_dtype: float32
  activation_axis_order: [item, view, carrier, distance, endpoint, width]
  completed_shards_are_never_reacquired: true
  incomplete_stage_policy: fail_closed_manual_adjudication_before_any_retry
  raw_activations_committed_to_git: false

tokenization_guardrail:
  exact_stratum_key: [glyph_token_count, unicode_name_token_count, codepoint_literal_token_count]
  eligible_rule: retain_items_in_strata_with_at_least_two_members
  candidate_and_query_universe: eligible_items_only
  centering_and_normalization: recomputed_within_eligible_subset
  null: permute_official_name_correspondence_only_within_exact_strata_common_across_all_eight_cells
  codepoint_control: observed_and_fixed
  singleton_items: excluded_from_matched_component_only_and_reported
  minimum_eligible_items: 250
  role: required_component_of_each_model_intersection_union_test

model_primary_endpoint:
  query_view: glyph
  positive_target_view: unicode_name
  negative_control_view: codepoint_literal
  metric: forward_top1_item_retrieval_after_separate_view_centering_and_row_l2_normalization
  cells: complete_two_carrier_by_four_distance_grid
  statistic: minimum_over_eight_cells_of_glyph_name_top1_minus_glyph_codepoint_top1
  components:
    unrestricted: all_292_items_common_unrestricted_official_name_permutation
    tokenization_matched: exact_triple_token_count_stratified_official_name_permutation
  intersection_union_p_value: max_unrestricted_and_tokenization_matched_component_p_values
  practical_rule: both_component_observed_minimum_contrasts_at_least_0.02
  practical_minimum: 0.02
  randomization_draws: 19999
  seed_base: 2026082900
  seed_rule: seed_base_plus_ten_times_model_order_index_plus_component_index_one_or_two
  p_value: one_plus_exceedances_divided_by_20000
  alpha: 0.05

cross_model_primary:
  id: at_least_three_of_four_frozen_core_model_tokenizer_cells
  core_order: [llama32_3b_base_bf16, qwen25_7b_base_bf16, olmo2_1b_base_bf16, gemma2_2b_it_bf16]
  m: 4
  r: 3
  partial_conjunction_method: bonferroni
  p_value: min_one_and_m_minus_r_plus_one_times_rth_smallest_core_model_iut_p
  statistical_rule: partial_conjunction_p_le_0.05
  practical_rule: at_least_three_core_cells_pass_both_registered_practical_floors
  positive_rule: statistical_and_practical_rules_both_hold
  alpha: 0.05
  authorized_positive_wording: at_least_three_of_four_frozen_core_model_tokenizer_cells_replicate
  independence_claim_authorized: false

bounded_model_cell_family:
  roles: all_nine_frozen_model_tokenizer_cells
  multiplicity: holm_on_nine_model_intersection_union_p_values
  familywise_alpha: 0.05
  rejection_requires_practical_rule: true
  relationship_to_cross_model_primary: secondary_exact_cell_roster_cannot_rescue_partial_conjunction

secondary_outputs:
  decision_authorized: false
  outputs:
    - raw_last_decoder_block_endpoint_replication_profile
    - primary_minus_raw_last_block_endpoint_differences
    - qwen25_base_four_point_size_profile
    - all_model_cellwise_top1_mrr_margin_and_centered_linear_cka
    - token_count_histograms_and_exact_stratum_coverage
    - per_carrier_and_per_distance_profiles
    - latency_peak_memory_and_artifact_size_engineering_metrics
    - descriptive_comparison_with_known_t9_mistral7b_base_result

