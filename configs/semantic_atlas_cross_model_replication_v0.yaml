runtime:
  backend: transformers
  device: cuda
  dtype: bfloat16
  local_files_only: true
  trust_remote_code: false
  use_cache: false
  output_hidden_states: true
  hardware_pin: NVIDIA GeForce RTX 5090
  critical_versions:
    glyphprobe: 0.1.0
    torch: 2.13.0+cu132
    transformers: 5.15.0
    numpy: 2.5.2
    PyYAML: 6.0.3

outcome_registry:
  at_least_three_of_four_core_cells_replicate: >-
    The partial-conjunction p-value is at most 0.05 and at least three core
    cells pass both practical floors. This supports only the registered frozen
    model/tokenizer-cell statement.
  cross_model_replication_not_established: >-
    The registered statistical rule, practical rule, or both did not pass.
    Individual Holm-qualified cells remain bounded cell results and cannot
    rescue the cross-model primary.

forbidden_actions:
  - any_t10_candidate_model_forward_before_freeze_commit
  - post_outcome_model_item_endpoint_carrier_distance_or_metric_reselection
  - post_outcome_threshold_seed_stratum_or_partial_conjunction_change
  - secondary_endpoint_rescue_of_primary
  - model_cell_holm_family_rescue_of_cross_model_primary
  - intervention_or_generation
  - raw_activation_commit_to_git_or_spiralshare
  - semantic_decomposition_causal_mechanistic_behavioral_scale_law_or_model_general_claim
