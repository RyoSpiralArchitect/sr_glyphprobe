runtime:
  backend: transformers
  device: cuda
  dtype: bfloat16
  local_files_only: true
  trust_remote_code: false
  critical_versions:
    glyphprobe: 0.1.0
    torch: 2.13.0+cu132
    transformers: 5.15.0
    numpy: 2.5.2
    pydantic: 2.12.5
    PyYAML: 6.0.3
    orjson: 3.11.9
    safetensors: 0.8.0
  hardware_pin: NVIDIA GeForce RTX 5090

failure_policy:
  fail_closed_on_asset_hash_mismatch: true
  fail_closed_on_model_artifact_mismatch: true
  fail_closed_on_raw_or_carrier_tokenization_contract_mismatch: true
  fail_closed_on_model_type_layer_width_parameter_vocab_dtype_or_block_path_mismatch: true
  fail_closed_on_nonfinite_activation_or_logits: true
  retain_failed_model_cell: true
  prohibit_model_replacement_after_t6_outcomes: true
  prohibit_carrier_distance_layer_panel_endpoint_seed_or_model_reselection_after_t6_outcomes: true

outcome_pattern_registry:
  all_four_dense_distance_attenuation_candidate: >-
    All four model-level intersection-union tests survive Holm correction. This
    is recurrence of the fixed observational endpoint in the selected dense
    CUDA roster, not a universal, scale, backend, or confirmatory result.
  gemma3_size_pair_distance_attenuation: >-
    Both Gemma 3 cells survive Holm and the other two do not. Retain the exact
    split without promoting a single 4B/12B pair to a model-scale effect.
  gemma3_12b_only_distance_attenuation: >-
    Only Gemma 3 12B survives Holm. Retain the bounded cell result without
    attributing it to size, architecture, tokenizer, or instruction tuning.
  mixed_dense_model_distance_attenuation: >-
    A nonempty rejection set not covered by a named branch survives Holm.
    Report the exact set without post-outcome regrouping or magnitude ranking.
  no_dense_model_distance_attenuation: >-
    No model-level intersection-union test survives Holm. Retain both primary
    components and all profiles without promoting a carrier, distance, depth,
    model pair, or tail subcell.

forbidden_research_inputs:
  - data/targets/p2_confirmatory_targets_v1.jsonl
  - data/targets/c1_causal_holdout_targets_v1.jsonl
forbidden_actions:
  - activation_intervention
  - behavioral_generation
  - protected_target_access
  - post_outcome_model_carrier_distance_layer_family_endpoint_or_seed_selection
  - direct_cross_model_effect_magnitude_decision
  - model_scale_or_backend_effect_claim
  - monotonic_decay_disappearance_duration_or_persistence_claim
  - inferential_pooling_with_t5
