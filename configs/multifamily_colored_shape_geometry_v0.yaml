protocol_id: glyphprobe-multifamily-colored-shape-geometry-v0
manifest_path: ../data/manifests/multifamily_colored_shape_geometry_v0.json
experiment_role: prospective_exploratory_observational_activation_geometry
claim_boundary: >-
  Frozen observational resid_post geometry for one ten-item colored-shape panel
  in two predeclared MLX model cells. No intervention, behavior, semantic,
  mechanistic, causal, backend-parity, node-effect, quantization-equivalence,
  confirmatory, or Phase I paper-gate claim is authorized.

panel:
  path: ../data/emoji_panels/colored_shapes.yaml
  expected_items: 10
  colors: [brown, orange, green, blue, purple]
  shapes: [circle, square]
  construction: single_codepoint_colored_shape

input:
  context_id: raw
  template: "{glyph}"
  add_special_tokens: false
  position: last_nonpad
  site: resid_post
  return_attentions: false

layers:
  fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
  resolution: "min(num_layers - 1, floor(fraction * num_layers))"
  primary_fraction: 0.5
  selection_uses_activation_outcomes: false

primary_endpoint:
  id: circle_minus_square_shape_axis_parallelism
  definition: >-
    For each color c, form d_c = resid_post(circle_c) -
    resid_post(square_c), L2-normalize each d_c, and average the ten
    off-diagonal pairwise cosines across the five colors.
  test: exact_one_sided_square_label_permutation
  permutations: 120
  p_value: "count(T_permuted >= T_observed) / 120"
  hypothesis_family: [gemma2_2b_4bit, olmo3_7b_bf16]
  multiplicity: holm
  familywise_alpha: 0.05
  decision_scope: primary_layer_only

secondary_endpoints:
  - layerwise_shape_axis_parallelism
  - matched_color_cross_shape_cosine_excess_after_panel_centering
  - activation_rms
  - token_count_and_shared_prefix_diagnostics
  - first_forward_latency_and_peak_memory_engineering_only

models:
  order: [gemma2_2b_4bit, olmo3_7b_bf16]
  gemma2_2b_4bit:
    canonical_model_id: mlx-community/gemma-2-2b-4bit
    tokenizer_output_class: tokenization_output_class_01
    node: mac2
    expected_model_type: gemma2
    expected_num_layers: 26
    expected_model_dim: 2304
    expected_parameter_count: 2614341888
    expected_vocab_size: 256000
    expected_quantized: true
    expected_resolved_dtype: mlx.core.uint32
    expected_raw_item_token_count: 1
    minimum_shared_prefix_across_panel: 0
    matching_family: atomic_token_count_plus_unicode_construction
  olmo3_7b_bf16:
    canonical_model_id: local/olmo3-1025-7b
    tokenizer_output_class: tokenization_output_class_06
    node: mac1
    expected_model_type: olmo3
    expected_num_layers: 32
    expected_model_dim: 4096
    expected_parameter_count: 7298011136
    expected_vocab_size: 100278
    expected_quantized: false
    expected_resolved_dtype: mlx.core.bfloat16
    expected_raw_item_token_count: 3
    minimum_shared_prefix_across_panel: 1
    matching_family: equal_count_plus_shared_prefix_plus_unicode_construction

runtime:
  backend: mlx
  device: gpu
  dtype: auto
  local_files_only: true
  trust_remote_code: false
  critical_versions:
    mlx: 0.31.1
    mlx-lm: 0.31.2
    transformers: 4.57.6
  compatibility_caveat: >-
    mlx-lm 0.31.2 declares transformers>=5.0.0, while the preflight-qualified
    clean runtime uses transformers 4.57.6. This mismatch must remain visible
    in every receipt and prevents a backend-qualification claim.

failure_policy:
  fail_closed_on_asset_hash_mismatch: true
  fail_closed_on_model_artifact_mismatch: true
  fail_closed_on_tokenization_contract_mismatch: true
  fail_closed_on_nonfinite_activation_or_logits: true
  retain_failed_model_cell: true
  prohibit_model_replacement_after_outcomes: true
  prohibit_layer_or_panel_reselection_after_outcomes: true

outcome_pattern_registry:
  dual_model_observational_recurrence_candidate: >-
    Both primary effects are positive and both Holm-adjusted tests reject.
  gemma_only_heterogeneity: >-
    Only the Gemma primary cell rejects; atomic tokenization, quantization,
    model family, and node remain inseparable explanations.
  olmo_only_heterogeneity: >-
    Only the OLMo primary cell rejects; prefix-matched tokenization, scale,
    model family, precision, and node remain inseparable explanations.
  opposite_sign_heterogeneity: >-
    The two primary statistics have opposite signs, regardless of p-values.
  no_dual_model_recurrence: >-
    No stronger predeclared pattern applies; retain the complete negative or
    mixed result without selecting another layer.

forbidden_research_inputs:
  - data/targets/p2_confirmatory_targets_v1.jsonl
  - data/targets/c1_causal_holdout_targets_v1.jsonl
forbidden_actions:
  - activation_intervention
  - behavioral_generation
  - protected_target_access
  - post_outcome_layer_selection
  - direct_cross_model_effect_magnitude_comparison
