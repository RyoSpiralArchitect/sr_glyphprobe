    - qwen25_0p5b_base_bf16
    - olmo2_1b_base_bf16
    - qwen25_1p5b_base_bf16
    - smollm2_1p7b_base_bf16
    - gemma2_2b_it_bf16
    - llama32_3b_base_bf16
    - qwen25_3b_base_bf16
    - qwen25_7b_base_bf16
    - mistral7b_instruct_v03_bf16
  inferential_role: fixed_cached_model_tokenizer_cells_for_exploratory_stress_test
  shared_training_or_tokenizer_ancestry_independence_claim: forbidden

factorial:
  systems: [atomic, presentation, modifier, zwj, regional, keycap]
  rotations: [0, 1, 2, 3]
  wrappers: [w01_mark_anchor, w04_token_state, w10_sequence_continuation, w15_observation_inference]
  scale_lane:
    n_values: [1, 2, 3, 4, 5, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512]
    variants: [clone_exact_utf, within_cycle_forward, cross_cycle_forward]
    separator: none
  order_lane:
    n_values: [8, 16, 32, 64, 128, 256]
    diversity_families: [within, cross]
    order_variants:
      - forward_tail
      - reverse_tail
      - blocked_tail
      - interleave_ends_tail
      - shuffle_seed17_tail
      - shuffle_seed43_tail
    separators: [none, ascii_space, comma_space, newline, ascii_pipe]
    invariant: anchor_first_and_exact_item_multiset_matched_within_each_paired_order_family
  position_lane:
    n_values: [8, 16, 32, 64, 128, 256]
    background_families: [within, cross]
    anchor_positions: [first, middle, last]
    separators: [none, ascii_space, comma_space, newline, ascii_pipe]
    invariant: exactly_one_anchor_and_exact_item_multiset_matched_across_positions
  expected_records_per_model: 57312
  expected_records_total: 515808
  chunks_per_model: 11

tokenization:
  all_nine_role_preflights_before_final_freeze: true
  hard_max_full_prompt_tokens: 8192
  record_full_prompt_token_count: true
  record_full_prompt_token_multiset_sha256: true
  record_sequence_utf8_bytes: true
  record_sequence_unicode_scalar_count: true
  token_count_and_token_multiset_matched_pair_rates: descriptive_only
  no_tokenization_regression_rescue: true

capture:
  endpoint: raw_decoder_block_output_at_final_common_wrapper_token
  normalized_depth_fractions: [0.25, 0.50, 0.75, 1.0]
  site_indices_in_t13_eight_depth_roster: [1, 3, 5, 7]
  dtype_on_disk: float32
  generation_calls: 0

analysis:
  scale_reference: clone_exact_utf_at_same_n
  order_reference: forward_tail_at_same_family_n_separator_wrapper_anchor
  position_reference: first_at_same_background_n_separator_wrapper_anchor
  separator_reference: none_at_same_lane_variant_n_wrapper_anchor
  primary_descriptive_unit: system_by_rotation_by_wrapper
  uncertainty:
    bootstrap_replicates: 10000
    bootstrap_seed: 2026090101
    stratified_by: unicode_construction_system
    interval: equal_tailed_95_percent
  decision_status: exploratory_no_binary_scientific_gate

