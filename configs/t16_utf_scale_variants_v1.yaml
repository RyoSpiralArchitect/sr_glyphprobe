protocol_id: glyphprobe-t16-utf-scale-variants-v1
experiment_label: T16-UTF-X1
status_before_execution: static_design_candidate_zero_x1_model_forwards
question: >-
  Across nine already-frozen model/tokenizer cells, how do exact-string
  repetition, construction-family diversity, order, separators, and the
  position of one exact UTF anchor change final-wrapper hidden-state geometry
  as sequence length grows from 1 to 512 emoji items?
claim_boundary: >-
  T16-UTF-X1 is a large exploratory stress test downstream of T16-UTF. It
  freezes exact Unicode strings and exact item multisets for paired order and
  position contrasts, but model tokenization can still differ across prompts.
  Results describe hidden-state displacement conditional on recorded model,
  tokenizer, wrapper, sequence length, and token path. They do not establish
  tokenizer-independent Unicode composition, emoji meaning, a causal circuit,
  an instruction-tuning effect, a scale law, or model-population generality.

