protocol_id: glyphprobe-emoji-word-incongruence-interaction-v0
experiment_label: T15-A
experiment_role: prospective_exploratory_emoji_word_nonadditive_interaction_atlas
status_before_execution: static_design_candidate_zero_t15_model_forwards
question: >-
  Does an externally labeled emoji-word incongruence produce a non-additive
  hidden-state interaction whose steering response is more coherent or larger
  than structurally matched cross-axis interactions after exact balancing of
  emoji identity, word identity, polarity, source order, and wrapper fold?
claim_boundary: >-
  T15-A is exploratory and outcome-informed by T14 model/depth heterogeneity.
  It may describe a balanced non-additive interaction direction and its
  next-token distribution response. It cannot establish emoji meaning,
  contradiction detection, understanding, natural behavior, a causal circuit,
  tokenizer independence, architecture or model-population generality, or a
  scale law. The operational congruence labels come from the frozen panel, not
  from a claim about the studied models.

