models:
  order:
    - olmo2_1b_base_bf16
    - llama32_3b_base_bf16
    - qwen25_3b_base_bf16
    - qwen25_7b_base_bf16
  selection_reason: >-
    Exploratory outcome-informed roster fixed after T14: one non-Qwen positive
    1B cell, one positive Llama 3B cell, and Qwen 3B/7B cells with opposite T14
    signs. This maximizes boundary information and is not independent
    replication.

factorial:
  polarity_order: [positive, negative]
  source_orders: [emoji_then_word, word_then_emoji]
  source_frames:
    emoji_then_word: "emoji={emoji}; word={word}"
    word_then_emoji: "word={word}; emoji={emoji}"
  wrapper_folds: 4
  true_interaction: mean_incongruent_minus_mean_congruent
  cross_axis_control:
    construction: checkerboard interaction after cyclically shifting the word axis
    shifts: [1, 3, 5]
    semantic_status: structural_control_not_guaranteed_unrelated
  component_controls:
    - emoji_main_effect_inside_joint_grid
    - word_main_effect_inside_joint_grid
  exact_balance:
    - every emoji appears equally in congruent and incongruent core cells
    - every word appears equally in congruent and incongruent core cells
    - both polarity labels appear equally in every interaction grid
    - both source orders and all wrapper folds are retained

source_capture:
  readout: raw_decoder_block_output_at_final_common_wrapper_token
  depth_site_indices: [6, 7]
  depth_fractions: [0.875, 1.0]
  expected_prompt_sequences_per_model: 1288
  expected_source_metric_rows_per_model: 2048
  expected_direction_catalog_rows_per_model: 768
  frame_relative_additivity_residual: pair_delta_minus_emoji_delta_minus_word_delta
  final_token_gate: exact_within_each_model_source_order_and_wrapper

intervention:
  site: raw_decoder_block_output_at_target_last_nonpad
  magnitudes: [0.125, 0.25]
  primary_magnitude: 0.25
  signs: [-1, 1]
  normalization: >-
    unit RMS per source direction, then signed magnitude times target activation
    RMS; directions with source RMS at or below the frozen degeneracy floor are
    replaced by zero and retained as degenerate rows
  degeneracy_floor_rms: 1.0e-6
  generation_calls: 0

grids:
  kinds: [true_conflict, cross_axis_null, emoji_main, word_main, zero]
  true_conflict_rows_per_model: 16384
  cross_axis_null_rows_per_model: 49152
  emoji_main_rows_per_model: 16384
  word_main_rows_per_model: 16384
  zero_rows_per_model: 64
  expected_rows_per_model: 98368
  expected_rows_total: 393472

storage:
  external_only: true
  top_positive_and_negative_logit_deltas: 64
  countsketch_dimension: 256
  countsketch_seed: 2026082907
  full_logits_stored: false
  model_weights_copied: false
  prompt_bodies_in_response_ledger: false

analysis:
  status: frozen_before_any_t15_model_forward
  principal_units:
    response: target_prompt
    source_geometry: concept_axis
  target_aggregate: median
  repeated_condition_aggregate: median
  bootstrap_replicates: 20000
  bootstrap_seed: 2026090201
  interval: equal_tailed_percentile_95
  significance_tests: none_exploratory_descriptive_only
  required_complete_families:
    - A0_joint_additivity_residual_incongruent_minus_congruent
    - A1_shared_response_fingerprint_true_minus_cross_axis_null
    - A2_response_energy_true_minus_cross_axis_null
    - A3_source_direction_rms_true_minus_cross_axis_null
    - A4_word_minus_emoji_main_response
    - A5_source_order_sensitivity
    - A6_depth_and_dose_heterogeneity
  primary_descriptive_cell:
    family: A1_shared_response_fingerprint_true_minus_cross_axis_null
    magnitude: 0.25
    signs_reported_separately: true
    models_and_depths_reported_without_selection: true

runtime:
  backend: transformers
  device: cuda
  dtype: bfloat16
  local_files_only: true
  trust_remote_code: false
  hardware_pin: NVIDIA GeForce RTX 5090
  critical_versions:
    glyphprobe: 0.1.0
    torch: 2.13.0+cu132
    transformers: 5.15.0
    numpy: 2.5.2
    PyYAML: 6.0.3

execution_policy:
  tokenizer_preflight_before_final_freeze: true
  final_freeze_before_model_load: true
  complete_all_four_roles_before_scientific_open: true
  zero_shard_before_nonzero_shards: true
  check_foreign_gpu_processes_before_model_load_and_each_shard: true
  yield_exit_code_on_foreign_contention: 75
  completed_shards_are_never_reacquired: true
  no_overwrite: true
  adaptive_axis_word_emoji_model_depth_order_fold_sign_magnitude_endpoint_or_null_changes: forbidden
  outcome_inspection_before_all_four_roles_complete: forbidden

confirmation_boundary: >-
  Any later T15-C confirmation requires new concept axes, a new untouched
  target bank, a separately frozen model/backend role, and a prospective
  residual-subspace necessity/sufficiency/restoration protocol. T15-A cannot
  promote a favorable model, depth, sign, order, or cross-axis shift.

forbidden_research_inputs:
  - data/targets/p2_confirmatory_targets_v1.jsonl
  - data/targets/c1_causal_holdout_targets_v1.jsonl
  - any_c1_v2_or_future_t15c_target_bank
forbidden_actions:
  - any_T15_model_forward_before_final_freeze_commit
  - generation_or_free_form_behavior_scoring
  - adaptive_axis_or_cell_replacement
  - confirmatory_positive_or_negative_decision
  - causal_semantic_tokenizer_independent_scale_or_model_general_claim
  - raw_array_commit_to_git_or_spiralshare
