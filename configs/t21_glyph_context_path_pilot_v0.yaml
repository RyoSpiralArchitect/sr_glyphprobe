claim_boundary:
  - Previously evaluated items are deliberately reused for exploration.
  - Positive pilot effects do not constitute prospective replication.
  - Key/value replacement is restricted to readout-query attention messages.
  - Other query outputs and readout self-key/value messages are preserved.
  - Equal-sized suffix controls match position count, not attention mass or meaning.
  - Restoring every altered value is an engineering check, not independent causal evidence.
