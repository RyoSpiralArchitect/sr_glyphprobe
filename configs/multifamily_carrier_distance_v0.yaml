runtime:
  backend: mlx
  device: gpu
  dtype: auto
  local_files_only: true
  trust_remote_code: false
  critical_versions:
    mlx: 0.31.1
    mlx-lm: 0.31.2
    transformers: 4.57.6
    numpy: 2.5.2
  compatibility_caveat: >-
    mlx-lm 0.31.2 declares transformers>=5.0.0, while the preflight-qualified
    clean runtime uses transformers 4.57.6. Llama Stage-A parity also remains
    unqualified. These limitations stay visible in every receipt and prevent a
    backend-qualification claim.

failure_policy:
  fail_closed_on_asset_hash_mismatch: true
  fail_closed_on_model_artifact_mismatch: true
  fail_closed_on_raw_or_carrier_tokenization_contract_mismatch: true
  fail_closed_on_nonfinite_activation_or_logits: true
  retain_failed_model_cell: true
  prohibit_model_replacement_after_outcomes: true
  prohibit_carrier_distance_layer_panel_endpoint_or_seed_reselection_after_outcomes: true

outcome_pattern_registry:
  all_three_distance_attenuation_candidate: >-
    All three model-level intersection-union tests survive Holm correction;
    distance-1 matched-slot recurrence and a positive fixed log-distance
    contrast coexist in every predeclared model cell.
  structured_tokenizer_pair_distance_attenuation: >-
    Llama and OLMo survive Holm while Gemma does not; tokenization, architecture,
    scale, precision, and node remain inseparable and tokenizer equivalence is
    not claimed.
  olmo_only_distance_attenuation: >-
    Only OLMo survives Holm; its T4 carryover also shows the fixed attenuation
    contrast, while tokenizer, architecture, scale, precision, and node remain
    inseparable.
  llama_only_distance_attenuation: >-
    Only Llama survives Holm; the predeclared 3B transfer cell shows both
    distance-1 recurrence and the fixed attenuation contrast.
  gemma_only_distance_attenuation: >-
    Only Gemma survives Holm; retain the unexpected exploratory branch without
    a tokenizer, quantization, scale, or node claim.
  mixed_model_distance_attenuation: >-
    A predeclared nonempty rejection set not covered by a named branch survives
    Holm; report the exact set without comparing effect magnitudes.
  no_model_distance_attenuation: >-
    No model-level intersection-union test survives Holm; retain component and
    complete profile results without promoting a subcell.

forbidden_research_inputs:
  - data/targets/p2_confirmatory_targets_v1.jsonl
  - data/targets/c1_causal_holdout_targets_v1.jsonl
forbidden_actions:
  - activation_intervention
  - behavioral_generation
  - protected_target_access
  - post_outcome_carrier_distance_layer_family_endpoint_or_seed_selection
  - direct_cross_model_effect_magnitude_comparison
  - monotonic_decay_or_disappearance_claim_from_fixed_contrast
  - inferential_reuse_of_t4_outcomes
