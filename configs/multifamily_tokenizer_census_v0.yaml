protocol_id: glyphprobe-multifamily-tokenizer-census-v0
manifest_path: ../data/manifests/multifamily_tokenizer_census_v0.json
experiment_role: tokenizer_only_structural_census
claim_boundary: >-
  Descriptive tokenizer structure only. The census performs no model forward,
  activation capture, intervention, behavioral evaluation, semantic test,
  confirmation, causal localization, or Phase I gate decision.

tokenization:
  local_files_only: true
  use_fast: true
  trust_remote_code: false
  add_special_tokens: false
  contexts:
    - id: raw
      template: "{item}"
    - id: leading_space
      template: " {item}"
    - id: marker_wrapper
      template: "Marker: {item} ->"
    - id: glyph_prompt
      template: |-
        {item}
        probe

pairwise_controls:
  contexts: [raw, leading_space, glyph_prompt]
  report_all_pairs: true
  prefix_lengths: [1, 2]

panel_sources:
  - id: e1_sky_moon
    path: ../data/emoji_panels/e1_sky_moon.yaml
    expected_items: 10
    census_family: e1_sky
    construction: single_codepoint
  - id: e1_food
    path: ../data/emoji_panels/e1_food.yaml
    expected_items: 10
    census_family: e1_food
    construction: single_codepoint
  - id: e1_animals
    path: ../data/emoji_panels/e1_animals.yaml
    expected_items: 10
    census_family: e1_animals
    construction: single_codepoint
  - id: e1_transport
    path: ../data/emoji_panels/e1_transport.yaml
    expected_items: 10
    census_family: e1_transport
    construction: single_codepoint
  - id: e1_social
    path: ../data/emoji_panels/e1_social.yaml
    expected_items: 10
    census_family: e1_social
    construction: single_codepoint
  - id: colored_shapes
    path: ../data/emoji_panels/colored_shapes.yaml
    expected_items: 10
    census_family: colored_shape
    construction: single_codepoint
  - id: multifamily_sequences
    path: ../data/emoji_panels/multifamily_tokenizer_sequences_v0.yaml
    expected_items: 55
    census_family_from_item: true
    construction_from_item: true

expected_total_items: 115

node_rosters:
  mac1:
