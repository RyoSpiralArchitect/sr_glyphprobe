      canonical_model_id: local/llama-3.2-3b
    - label: mac1_mistral7b_instruct_v03
      canonical_model_id: mistralai/Mistral-7B-Instruct-v0.3
    - label: mac1_gpt2
      canonical_model_id: openai-community/gpt2
    - label: mac1_gemma4_e4b_it
      canonical_model_id: local/gemma-4-E4B-it
    - label: mac1_olmo3_7b
      canonical_model_id: local/olmo3-1025-7b
  mac2:
    - label: mac2_llama32_3b_bf16
      canonical_model_id: mlx-community/Llama-3.2-3B-bf16
    - label: mac2_mistral7b_instruct_v03_4bit
