protocol_id: glyphprobe-t20-lexical-alias-optimized-subspace-causal-v0
experiment_label: T20-C
status: design_candidate_zero_t20_model_forwards_or_interventions
question: >-
  Does an interchange-optimized rank-8 subspace at a late residual-stream or
  component site causally support held-out glyph-to-alias retrieval in the
  pinned Llama 3.2 3B cell where the T19 closed-form cross-covariance rule did
  not, and how do its adjusted effects compare with the full-representation
  interchange ceiling at the same site?
claim_boundary: >-
  T20-C is a conditionally admitted follow-up to the registered T19-C negative.
  It changes exactly five prespecified things relative to T19-C: the subspace
  may be learned by interchange optimization on the same source bank; three
  residual-stream sites join the six component sites; the decision endpoint is
  gated on the alias-retrieval component alone with a codepoint self-retrieval
  guard; the evaluation bank is 384 fresh atomic emoji with zero prior T19 or
  T20 forwards, read in four contexts; and every site carries a
  full-representation interchange ceiling as a positive control. Training
  reuses the frozen 128-item T19 causal-source bank. A positive result
  supports only bounded component-level causal contribution for this cell,
  rank, and endpoint. A negative result at a site whose ceiling passes bounds
  rank-8 interchange-learnable subspaces at that site; a negative result at a
  site whose ceiling fails is recorded as uncalibratable at this endpoint. The
  result cannot establish rendered-glyph perception, human meaning, a unique
  or complete circuit, tokenizer independence, pretraining novelty,
  architecture or model-population generality, a scale law, or
  natural-language behavior; behavioral endpoints are deliberately out of
  scope and remain with the T16-OSC record.

source_bindings:
  t19_config:
    path: configs/t19_lexical_alias_unicode_control_v0.yaml
    sha256: 7d1f25f4121bbf72880e447002fb0623c891d3bfc25e3329807fa925feadf3c4
  t19_selection:
    path: data/manifests/t19_lexical_alias_unicode_control_v0.json
    sha256: 7a51d38effe67e74ff1264ae61c652e4192088063c3d31c874421f0b4dad8ee2
  t19_freeze:
    path: data/manifests/t19_lexical_alias_unicode_control_v0_freeze.json
    sha256: 5dbbe0ef746cc3a002b8916de647a1c16a1e9f76a3f31fd4a0b53966f9c212fc
  t19_causal_go:
    path: data/manifests/t19_lexical_alias_component_causal_v0_go.json
  t19_causal_analysis_status_required: causal_analysis_complete
  unicode_sources: reuse_t19_source_bindings_verbatim_hash_pinned

population:
  selection_namespace_rule: reuse_t19_namespace_for_matching_reproduction
  fresh_eval_role: t20-causal-fresh-eval
  fresh_eval_emoji_items: 384
  source_bank: reuse_frozen_t19_causal_source_items_verbatim
  reproduction_audit: >-
    Re-running the frozen T19 selection builder on the hash-pinned sources must
    reproduce the frozen T19 selection manifest byte-identically before any
    fresh row is drawn; the fresh bank is drawn from the unused remainder of
    the same deterministic matching.
  overlap_with_any_t19_bank: forbidden
  alias_uniqueness: global_across_t19_and_t20_banks
  replacement_or_exclusion_after_freeze: forbidden

fixed_model:
  role: llama32_3b_base_bf16
  expected_num_layers: 28
  expected_model_dim: 3072

input:
  carrier_order: [pipe, article_a]
  carriers:
    pipe: {unit: " |", repeats: 8}
    article_a: {unit: " a", repeats: 8}
  distance_order: [1, 4]
  evaluation_contexts: 4
  add_special_tokens: false
  position_rule: view_token_count_plus_distance_minus_one
  views: [glyph, alias_label, codepoint_literal]

sites:
  order:
    - {site: resid_out, block_index: 21}
    - {site: resid_out, block_index: 24}
    - {site: resid_out, block_index: 27}
    - {site: attn_out, block_index: 21}
    - {site: mlp_out, block_index: 21}
    - {site: attn_out, block_index: 24}
    - {site: mlp_out, block_index: 24}
    - {site: attn_out, block_index: 27}
    - {site: mlp_out, block_index: 27}
  primary:
    - {site: resid_out, block_index: 21}
    - {site: resid_out, block_index: 24}
  site_definitions:
    resid_out: decoder_block_output_hidden_state_after_residual_addition
    attn_out: attention_output_projection_before_residual_addition
    mlp_out: mlp_down_projection_before_residual_addition

subspace:
  rank: 8
  constructions: [optimized_interchange, cross_covariance_svd, deflated_span_random]
  necessity_mean: source_bank_glyph_mean_per_site
  random_control: sixteen_seeded_gaussian_draws_in_source_span_deflated_qr_first_eight
  random_seed_base: 2026091000
  training:
    source_context: {carrier: pipe, distance: 1}
    objective: >-
      InfoNCE toward the own-item alias final state for the patched codepoint
      forward, plus a hinge margin pushing the ablated glyph forward below its
      own alias, in the centered row-normalized source-gallery geometry.
    train_items: 96
    validation_items: 32
    split_rule: sha256_of_namespace_and_bank_index_ascending_first_96_train
    optimizer: adam
    learning_rate: 0.001
    steps: 600
    batch_items: 32
    infonce_temperature: 20.0
    necessity_margin: 0.1
    necessity_weight: 1.0
    parametrization: torch_orthogonal_first_eight_columns
    precision: fp32_training_bf16_injection_at_evaluation
    seeds: [0, 1, 2]
    seed_selection: >-
      maximum validation (patched alias top-1 minus ablated alias top-1);
      ties broken by lowest seed. Selection uses source-bank items only.

evaluation:
  glyph_condition_order:
    [zero_hook, necessity_optimized, necessity_random, necessity_svd, restoration_optimized, full_interchange_codepoint]
  codepoint_condition_order:
    [zero_hook, sufficiency_optimized, sufficiency_random, sufficiency_svd, full_interchange_glyph]
  baseline_batch_geometry: {glyph: 6, codepoint_literal: 5, alias_label: 1}
  endpoint: per_context_384_way_cosine_top1_averaged_over_4_contexts
  registered_construction: optimized_interchange
  secondary_constructions: [cross_covariance_svd]

primary_decision:
  alpha: 0.05
  endpoint_component: alias_top1_only
  necessity_effect: alias_top1(necessity_random)_minus_alias_top1(necessity_optimized)
  sufficiency_effect: alias_top1(sufficiency_optimized)_minus_alias_top1(sufficiency_random)
  practical_minimum_each: 0.02
  interval_rule: bootstrap_lower_95_above_practical_minimum
  self_retrieval_guard: codepoint_self_top1_under_sufficiency_optimized_at_least_0.90
  sign_flip_draws: 99999
  bootstrap_replicates: 20000
  sign_flip_seed_base: [2026091100, 2026091101]
  bootstrap_seed_base: [2026091200, 2026091201]
  holm_over_primary_sites: 2
  engineering_rms_maximum: 1.0e-6
  ceiling_positive_control:
    sufficiency_ceiling: alias_top1(full_interchange_glyph)_minus_alias_top1(zero_hook_codepoint)
    necessity_ceiling: alias_top1(zero_hook_glyph)_minus_alias_top1(full_interchange_codepoint)
    informative_minimum: 0.06
    interpretation_rule: >-
      A primary site failing the decision while its sufficiency ceiling is
      below the informative minimum is recorded as uncalibratable at this
      endpoint, not as a negative for the low-rank account. No ceiling value
      can flip a failed decision to positive.
  no_replacement_rule: >-
    No site, rank, construction, context, bank, guard, floor, or endpoint may
    be replaced after any evaluation-bank forward.

acquisition:
  expected_source_capture_forwards: 384
  expected_training_forward_passes_maximum: 194400
  expected_evaluation_forwards: 32256
  expected_intervention_rows: 124416
  generation_calls: 0

execution_policy:
  backend: transformers_cuda_bfloat16
  hardware_pin: NVIDIA GeForce RTX 5090
  yield_exit_code_on_foreign_contention: 75
  batch_size_unique_sequences: one_item_conditions_stacked_on_batch_axis
