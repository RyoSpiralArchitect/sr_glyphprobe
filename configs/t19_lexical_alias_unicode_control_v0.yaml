protocol_id: glyphprobe-t19-lexical-alias-unicode-control-v0
experiment_label: T19-L/C
status: design_candidate_zero_t19_model_forwards_or_interventions
question: >-
  Does a raw atomic emoji retrieve a lexically disjoint CLDR keyword as well as
  its canonical CLDR short name, relative to a literal U+ codepoint string;
  what part of that relation is shared by non-emoji Unicode symbols; and, if
  the emoji alias gate passes, do fixed late attn_out or mlp_out subspaces
  causally support the held-out glyph-to-alias retrieval relation?
claim_boundary: >-
  T19-L is a prospectively frozen endpoint-and-label follow-up on atomic emoji
  surfaces that may have appeared in earlier repository experiments, plus a
  text-repository-fresh non-emoji Unicode-symbol control. The alternative label
  is one exact CLDR keyword whose ASCII-alphanumeric words are disjoint from the
  canonical CLDR tts words; it is a source-auditable keyword alias, not a
  human-rated paraphrase. T19-C, if admitted, tests a fixed low-rank
  representation intervention in one pinned Llama 3.2 3B Transformers/CUDA
  cell on a bank with zero T19-L forwards. A positive result would support only
  bounded lexical correspondence and component-level causal contribution under
  these inputs and endpoints. It cannot establish rendered-glyph perception,
  human meaning, understanding, a unique or complete circuit, tokenizer
  independence, pretraining novelty, architecture or model-population
  generality, a scale law, tuning effects, or natural-language behavior.

source_bindings:
  unicode_emoji_test:
