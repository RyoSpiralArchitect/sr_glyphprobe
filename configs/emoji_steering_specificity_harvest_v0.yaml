population:
  source: t11_selection_manifest
  rule: included_in_depth_subset_is_true
  order: ascending_depth_index
  already_exposed_only: true
  expected_items: 192
  expected_present_item_views: 912
  system_order: [atomic_anchor, presentation, modifier, zwj, regional_flag, keycap]
  expected_system_counts:
    atomic_anchor: 24
    presentation: 24
    modifier: 40
    zwj: 56
    regional_flag: 40
    keycap: 8
  replacement_or_exclusion_after_freeze: forbidden

source_forms:
  order: [glyph, unicode_name, component_name, codepoint_literal, decomposed_form]
  atomic_anchor_available: [glyph, unicode_name, codepoint_literal]
  unusual_system_available: [glyph, unicode_name, component_name, codepoint_literal, decomposed_form]
  item_intervention_order: [glyph, unicode_name, decomposed_form]
  prompt_template: source_text_newline_wrapper_text
  direction: mean_over_four_wrapper_deltas_against_bare_wrapper
  wrapper_delta: raw_decoder_block_output_at_wrapper_last_nonpad_with_source_minus_bare_wrapper
  no_source_form_is_semantic_ground_truth: true

depth:
  normalized_fractions: [0.125, 0.25, 0.375, 0.50, 0.625, 0.75, 0.875, 1.0]
  block_index_rule: max_zero_floor_fraction_times_num_hidden_layers_minus_one
  endpoint: raw_selected_decoder_block_output
  primary_item_intervention_fraction: 0.50
  cross_architecture_mechanistic_equivalence_claimed: false

source_bank:
  models: all_nine
  item_shard_size: 16
  expected_shards_per_model: 12
  expected_wrapper_forward_sequences_per_model: 3652
  expected_target_baseline_forward_sequences_per_model: 32
  expected_total_forward_sequences_per_model: 3684
  expected_total_forward_sequences: 33156
  expected_wrapper_delta_vectors_per_model: 29184
  expected_mean_direction_vectors_per_model: 7296
  expected_target_activation_vectors_per_model: 256
  expected_total_stored_vectors_per_model: 36736
  expected_total_stored_vectors: 330624
  activation_dtype: float32
  store_full_baseline_logits: true
  raw_arrays_committed_to_git: false
  raw_arrays_put_on_spiralshare: false

pilot:
