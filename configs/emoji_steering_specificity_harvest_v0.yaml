    signs: [-1, 1]
    expected_response_rows_per_model: 43008
  random_grid:
    distribution: standard_normal_then_unit_rms
    seed_namespace: glyphprobe-t13eh-v0-random
    seeds_per_depth: 64
    depth_fractions: all_eight
    magnitudes: [0.125, 0.25, 0.50]
    expected_response_rows_per_model: 49152
  zero_grid:
    all_depth_target_cells: true
    exact_logit_noop_required: true
    expected_response_rows_per_model: 256
  expected_response_rows_per_model: 127744
  expected_response_rows_total: 383232
  normalization: direction_unit_rms_times_signed_magnitude_times_target_activation_rms
  site: raw_decoder_block_output_at_target_last_nonpad
  generation_calls: 0
  response_storage:
    top_positive_and_negative_logit_deltas: 64
    countsketch_dimension: 256
    countsketch_seed: 2026082907
    full_intervention_logits_stored: false
    metrics:
