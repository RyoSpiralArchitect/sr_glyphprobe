runtime:
  backend: transformers
  loader_authority: t13eh_freeze_and_committed_runtime_preflight
  stale_t11_narrative_assets_are_not_reaudited_at_t13eh_runtime: true
  device: cuda
  dtype: bfloat16
  local_files_only: true
  trust_remote_code: false
  use_cache: false
  hardware_pin: NVIDIA GeForce RTX 5090
  critical_versions:
    glyphprobe: 0.1.0
    torch: 2.13.0+cu132
    transformers: 5.15.0
    numpy: 2.5.2
    PyYAML: 6.0.3

acquisition_policy:
  explicit_model_path_allowed_only_after_exact_artifact_receipt_match: true
  completed_shards_are_never_reacquired: true
  incomplete_stage_requires_manual_adjudication: true
  check_foreign_gpu_processes_before_model_load_and_each_shard: true
  yield_exit_code_on_foreign_contention: 75
  outcome_inspection_during_queue: forbidden
  adaptive_item_model_target_depth_strength_or_endpoint_selection: forbidden
  queue_may_stop_only_for_contention_failure_or_complete_fixed_roster: true

analysis_policy:
  status: deferred_cpu_or_mps_work_after_acquisition
  no_primary_hypothesis: true
  no_practical_floor: true
  no_confirmatory_decision: true
  allowed_later_analyses:
    - token_signature_matched_source_form_comparisons
    - depth_and_dose_response_surfaces
    - positive_negative_antisymmetry
    - item_system_target_and_model_heterogeneity
    - target_entropy_and_margin_sensitivity
    - top_delta_and_countsketch_semantic_probe_exploration
    - bounded_supplementary_figures_and_future_work_selection
  later_t13c_must_use_a_new_untouched_bank_and_new_freeze: true

forbidden_research_inputs:
  - data/targets/p2_confirmatory_targets_v1.jsonl
  - data/targets/c1_causal_holdout_targets_v1.jsonl
forbidden_actions:
  - any_T13EH_model_forward_before_static_freeze_commit
  - any_T13EH_model_forward_before_tokenizer_and_runtime_preflight_commit
  - reading_tokenizing_forwarding_or_scoring_any_protected_target_bank
  - outcome_dependent_queue_item_model_target_depth_strength_or_endpoint_changes
  - generation_or_free_form_output_selection
  - confirmatory_positive_or_negative_decision
  - semantic_mechanistic_tokenizer_independence_scale_instruction_or_model_general_claim
  - raw_array_commit_to_git_or_spiralshare
