protocol_id: glyphprobe-emoji-steering-specificity-harvest-v0
experiment_label: T13-EH
experiment_role: prospective_exploratory_gpu_harvest_no_confirmatory_decision
status_before_execution: design_candidate_zero_t13eh_model_forwards
question: >-
  Which source-form, depth, target, sign, and dose response tensors should be
  preserved now so that later CPU/MPS analysis can test whether emoji-derived
  interventions differ from official-name, component, decomposed, codepoint,
  and random alternatives without reacquiring GPU-dependent observations?
claim_boundary: >-
  T13-EH is an exploratory acquisition-only harvest over an already exposed
  192-item population and all 32 public prestage targets. It has no primary
  hypothesis, practical floor, confirmatory target bank, generation endpoint,
  or authorized positive decision. It can describe source-form geometry and
  intervention-response heterogeneity in the fixed cells. It cannot establish
  emoji meaning, understanding, unique emoji specificity, causality of a
  mechanism, behavioral steering, tokenizer independence, a scale law,
  instruction-tuning effects, architecture or population generality, or
  independent replication. It cannot alter or rescue T10, T11, or T12.

