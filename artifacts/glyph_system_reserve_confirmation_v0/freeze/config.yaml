protocol_id: glyphprobe-glyph-system-reserve-confirmation-v0
experiment_label: T12
experiment_role: prospective_single_use_two_hypothesis_confirmation
status_before_execution: design_candidate_zero_t12_reserve_model_forwards
pre_execution_correction:
  superseded_freeze_commit: 7b49d801b49d52052f0b3d73021a628d77a9986b
  reason: >-
    The first published v0 freeze copied obsolete pre-T11 package versions
    into this config. The runner delegated runtime validation to the correctly
    pinned T11 implementation, so no mismatched execution occurred. This
    correction was frozen before tokenizer preflight, model-weight loading, or
    any T12 reserve model forward.
  t12_reserve_model_forward_calls_before_correction: 0
question: >-
  Do the ZWJ fused-form advantage and the regional-flag dual whole/component
  structure reproduce in the complete, previously unforwarded T11 reserves
  across the same fixed nine model/tokenizer cells and eight contexts?
claim_boundary: >-
  T12 is a one-shot confirmation in the complete 96-item ZWJ and 64-item
  regional-flag reserves selected before T11 acquisition. It tests two
  discovery-informed hypotheses at the API-returned final hidden state with
  exact target-token-length controls, a first-target-token sensitivity gate,
  fixed practical floors, fixed model-heterogeneity gates, and Holm correction.
  A positive result may establish only reproducibility of the operational
  contrasts in this fixed model/tokenizer roster and transport grid. It cannot
  establish emoji meaning, understanding, causality, mechanism, behavioral
  steering, tokenizer independence, a scale law, instruction-tuning effects,
  architecture generality, model-population generality, or independent
  replication; it cannot rescue or alter T10.

