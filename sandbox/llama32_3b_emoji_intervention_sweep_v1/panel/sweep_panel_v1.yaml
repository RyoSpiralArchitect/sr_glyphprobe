# Exploratory emoji panel for the out-of-contract per-glyph intervention sweep.
#
# NOT a frozen panel. NOT a holdout bank. Assembled purely from public,
# already-explored glyph space for sandbox exploration.
#
# Two strata:
#   matched — every glyph costs exactly 4 prefix tokens in the wrapper
#             "<glyph>\n<target>", so a within-stratum ranking is NOT
#             explained by token count (the confound that HOLDs elsewhere).
#   ladder  — deliberately spans 2..16 prefix tokens to MEASURE how much
#             token count alone drives intervention magnitude.
#
# n_prefix_tokens below is the surveyed value; the runner recomputes it and
# fails loudly on any mismatch rather than trusting this file.

