# OUT-OF-CONTRACT exploratory config. NOT the sealed v2 protocol.
# Repo-relative / HF-id form of the config that produced chart/fp_chart_data.json.
# Same model + arithmetic as recorded; only paths are made portable.
schema_version: 1
mode: internal
backend:
  kind: transformers
  model: mlx-community/Llama-3.2-3B-bf16
  revision: 60a99aaf43164077157d64bf909b7b61143c6a6d
  device: mps
  dtype: float32            # bf16 on disk -> fp32 runtime (passes the dtype guard)
  local_files_only: true    # resolved from the local HF cache ($HF_HOME)
  add_special_tokens: false
  trust_remote_code: false
  # no validation_receipt -> the transformers backend enables ACTIVATION_PATCH anyway
run:
  name: scaled-llama3b-bf16-transformers-ooc
  output_root: ../../../runs          # gitignored; not part of the scientific record
  seeds: [101, 211, 307]
  resume: false
  fail_fast: true
  replicate_mode: wrapper_subsample
  wrapper_subsample_fraction: 0.75
panel:
  file: ../../../data/emoji_panels/colored_shapes.yaml
  neutral_glyph: "·"
  centroid_mode: panel
source:
  wrappers_file: ../../../data/wrappers/source_wrappers.jsonl
  max_wrappers: 16
  anchor_position: last_nonpad
targets:
  cases_file: ../../../data/targets/prestage_targets.jsonl   # non-holdout pre-stage bank
  max_cases: 24
  calibration_cases: 6
capture:
  site: resid_post
  layers: [5, 11]           # same depths as the sealed v2 cell (used out-of-contract here)
  position: last_nonpad
  return_attentions: false
intervention:
  mode: activation_add
  normalization: rms
  strengths: [0.025, 0.05, 0.10]
  position: last_nonpad
  clip: {mode: global_rms, max_ratio: 0.25}
  iso_kl: {enabled: false}
controls:
  random_directions_per_layer: 2
  zero_direction: true
  sign_flip: true
  sign_flip_strengths: [0.05]
  label_shuffle_permutations: 200
  include_neutral_direction: true
metrics:
  top_k: 50
  fingerprint_dim: 96
  fingerprint_seed: 8675309
  split_half_repeats: 200
  rbo_p: 0.90
  save_top_logit_deltas: 32
  save_fingerprints: true
  epsilon: 1.0e-12
sae:
  enabled: false
surface:
  emoji_template: "{emoji}\n{prompt}"
  neutral_template: "{prompt}"
  system_prompt: null
