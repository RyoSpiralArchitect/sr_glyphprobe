[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphprobe"
version = "0.1.0"
description = "A capability-aware emoji and glyph activation cartography harness for language models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ryō ∴ SpiralArchitect" }]
keywords = ["mechanistic-interpretability", "steering", "activation-patching", "emoji", "transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "orjson>=3.10",
  "scipy>=1.12",
]

[project.optional-dependencies]
torch = [
  "torch>=2.4",
  "transformers>=4.48,<6",
  "accelerate>=1.0",
  "safetensors>=0.4",
]
mlx = [
  "mlx>=0.31,<0.32",
  "mlx-lm>=0.31,<0.32",
  "transformers>=4.48,<6",
  "safetensors>=0.4",
]
lens = [
  "torch>=2.4",
  "transformers>=4.48,<6",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "transformer-lens>=2.0",
]
sae = [
  "torch>=2.4",
  "transformers>=4.48,<6",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "transformer-lens>=2.0",
  "sae-lens>=6,<7",
]
server = [
  "openai>=1.50",
  "httpx>=0.27",
]
all = [
  "torch>=2.4",
  "mlx>=0.31,<0.32",
  "mlx-lm>=0.31,<0.32",
  "transformers>=4.48,<6",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "transformer-lens>=2.0",
  "sae-lens>=6,<7",
  "openai>=1.50",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
glyphprobe = "glyphprobe.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glyphprobe = ["resources/**/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["glyphprobe"]
branch = true
